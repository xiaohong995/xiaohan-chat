name: build-apk

on:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create keystore
        run: |
          keytool -genkeypair -keystore release.keystore -alias xiaohan -keyalg RSA -keysize 2048 -validity 10000 -storepass xiaohan123 -keypass xiaohan123 -dname "CN=XiaoHan"
          echo "KS_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          echo "KS_PASS=xiaohan123" >> $GITHUB_ENV
          echo "KEY_ALIAS=xiaohan" >> $GITHUB_ENV
          echo "KEY_PASS=xiaohan123" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease

      - name: Commit APK
        run: |
          cp app/build/outputs/apk/release/*.apk xiaohan.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xiaohan.apk
          git diff --cached --quiet || git commit -m "build signed apk [skip ci]"
          git push
